basePath: /api
definitions:
  dto.CategoryAveragePrice:
    properties:
      avg_price:
        type: number
      category:
        type: string
    required:
    - avg_price
    - category
    type: object
  dto.CategoryResponse:
    properties:
      created_at:
        example: "2025-01-01T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      slug:
        example: keyboard
        type: string
      title:
        example: Keyboard
        type: string
    required:
    - created_at
    - id
    - slug
    - title
    type: object
  dto.CategoryRevenueResponse:
    properties:
      category:
        type: string
      growth:
        $ref: '#/definitions/dto.GrowthResponse'
      orders:
        type: integer
      products:
        type: integer
      revenue:
        type: number
    required:
    - category
    - growth
    - orders
    - products
    - revenue
    type: object
  dto.CountResponse:
    properties:
      count:
        example: 1
        type: integer
    required:
    - count
    type: object
  dto.CreateOrderItem:
    properties:
      product_id:
        type: integer
      quantity:
        type: integer
    type: object
  dto.CreateOrderRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.CreateOrderItem'
        type: array
      user_id:
        example: 1
        type: integer
    type: object
  dto.CreateOrderResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/dto.OrderItemResponse'
        type: array
      user_id:
        type: integer
    required:
    - created_at
    - id
    - items
    - user_id
    type: object
  dto.CreateProductRequest:
    properties:
      category_id:
        type: integer
      price:
        example: 150
        type: number
      title:
        example: Keyboard
        type: string
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
    required:
    - email
    - name
    type: object
  dto.CursorProductsResponse:
    properties:
      next_cursor:
        type: integer
      products:
        items:
          $ref: '#/definitions/dto.ProductResponse'
        type: array
    required:
    - next_cursor
    - products
    type: object
  dto.CursorUserResponse:
    properties:
      next_cursor:
        type: integer
      users:
        items:
          $ref: '#/definitions/dto.UserResponse'
        type: array
    required:
    - next_cursor
    - users
    type: object
  dto.DailyPurchases:
    properties:
      order_date:
        type: string
      purchases:
        type: integer
    required:
    - order_date
    - purchases
    type: object
  dto.DailyStatResponse:
    properties:
      date:
        example: "2026-05-11 01:45:24.864701"
        type: string
      orders:
        example: 1
        type: integer
      revenue:
        example: 120
        type: number
    required:
    - date
    - orders
    - revenue
    type: object
  dto.DailyUserRegistrationResponse:
    properties:
      count:
        type: integer
      createdAt:
        type: string
    required:
    - count
    - createdAt
    type: object
  dto.GrowthResponse:
    properties:
      sign:
        type: string
      value:
        type: number
    required:
    - sign
    - value
    type: object
  dto.ListCategoryAvaragePriceResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.CategoryAveragePrice'
        type: array
      total:
        type: integer
    required:
    - data
    - total
    type: object
  dto.ListCategoryResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.CategoryResponse'
        type: array
      total:
        type: integer
    required:
    - data
    - total
    type: object
  dto.ListCategoryRevenueResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.CategoryRevenueResponse'
        type: array
      total:
        type: integer
    required:
    - data
    - total
    type: object
  dto.ListDailyPurchasesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.DailyPurchases'
        type: array
      total:
        type: integer
    required:
    - data
    - total
    type: object
  dto.ListDailyStatResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.DailyStatResponse'
        type: array
      total:
        type: integer
    required:
    - data
    - total
    type: object
  dto.ListOrderResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.OrderResponse'
        type: array
      total:
        type: integer
    required:
    - data
    - total
    type: object
  dto.ListProductResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.ProductResponse'
        type: array
      total:
        type: integer
    required:
    - data
    - total
    type: object
  dto.ListRevenueReportResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.RevenueReportResponse'
        type: array
      total:
        type: integer
    required:
    - data
    - total
    type: object
  dto.ListUserByMostExpensiveProductResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.UserByMostExpensiveProduct'
        type: array
      total:
        type: integer
    required:
    - data
    - total
    type: object
  dto.ListUserResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.UserResponse'
        type: array
      total:
        type: integer
    required:
    - data
    - total
    type: object
  dto.ListUserWithTotalResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.UserWithTotalSpent'
        type: array
      total:
        type: integer
    required:
    - data
    - total
    type: object
  dto.OrderItemResponse:
    properties:
      price:
        type: number
      product_id:
        type: integer
      quantity:
        type: integer
      title:
        type: string
    required:
    - price
    - product_id
    - quantity
    - title
    type: object
  dto.OrderResponse:
    properties:
      created_at:
        example: "2026-05-11 01:45:24.864701"
        type: string
      id:
        example: 1
        type: integer
      user_id:
        example: 1
        type: integer
    required:
    - created_at
    - id
    - user_id
    type: object
  dto.ProductResponse:
    properties:
      category:
        example: Electoronics
        type: string
      id:
        example: 1
        type: integer
      price:
        example: 150
        type: number
      title:
        example: Keyboard
        type: string
    required:
    - category
    - id
    - price
    - title
    type: object
  dto.RevenueReportResponse:
    properties:
      growth:
        $ref: '#/definitions/dto.GrowthResponse'
      revenue:
        type: number
      title:
        type: string
    required:
    - growth
    - revenue
    - title
    type: object
  dto.RevenueStatsResponse:
    properties:
      averageOrderValue:
        example: 123.123
        type: number
      totalProductsSold:
        example: 123
        type: integer
      totalRevenue:
        example: 123.123
        type: number
    required:
    - averageOrderValue
    - totalProductsSold
    - totalRevenue
    type: object
  dto.StatsOrderResponse:
    properties:
      averageCheck:
        example: 1.3
        type: number
      total:
        example: 1
        type: integer
      totalThisMonth:
        example: 4.2
        type: number
    required:
    - averageCheck
    - total
    - totalThisMonth
    type: object
  dto.TopCategoryResponse:
    properties:
      revenue:
        type: number
      title:
        type: string
    type: object
  dto.UserByMostExpensiveProduct:
    properties:
      email:
        example: text@gmail.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: username
        type: string
    required:
    - email
    - id
    - name
    type: object
  dto.UserResponse:
    properties:
      email:
        example: text@gmail.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: username
        type: string
    required:
    - email
    - id
    - name
    type: object
  dto.UserWithTotalSpent:
    properties:
      email:
        example: text@gmail.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: username
        type: string
      totalSpent:
        example: 123.123
        type: number
    required:
    - email
    - id
    - name
    - totalSpent
    type: object
  dto.WidgetStatsResponse:
    properties:
      topCategory:
        $ref: '#/definitions/dto.TopCategoryResponse'
      totalCategories:
        type: integer
      totalProducts:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Educational SQL workshop backend API
  title: Shop API
  version: "1.0"
paths:
  /categories:
    get:
      description: Returns all categories from the database
      parameters:
      - description: Number of categories to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Number of categories to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListCategoryResponse'
      summary: List all categories
      tags:
      - categories
  /categories/avarage-price:
    get:
      description: Returns average product price grouped by category
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListCategoryAvaragePriceResponse'
      summary: Get average price per category
      tags:
      - categories
  /categories/revenue:
    get:
      description: Returns revenue, orders, products and growth per category
      parameters:
      - description: Number of categories to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Number of categories to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListCategoryRevenueResponse'
      summary: Get category revenue stats
      tags:
      - categories
  /categories/stats:
    get:
      description: Returns total categories, total products, and top category by revenue
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.WidgetStatsResponse'
      summary: Get category stats for widgets
      tags:
      - categories
  /orders:
    get:
      description: Returns all orders from the database
      parameters:
      - description: Number of products to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Number of products to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListOrderResponse'
      summary: List all orders
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Creates an order and publishes order.created event to Kafka
      parameters:
      - description: Order data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateOrderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new order
      tags:
      - orders
  /orders/{orderID}/items:
    get:
      description: Returns all items for a given order
      parameters:
      - description: Order ID
        in: path
        name: orderID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.OrderItemResponse'
            type: array
      summary: Get order items
      tags:
      - orders
  /orders/daily-purchases:
    get:
      description: Returns all orders from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListDailyPurchasesResponse'
      summary: List all daily purchases
      tags:
      - orders
  /orders/daily-stats:
    get:
      description: Returns daily stats from the database
      parameters:
      - description: Number of products to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Number of products to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListDailyStatResponse'
      summary: List daily stats
      tags:
      - orders
  /orders/stats:
    get:
      description: Returns statistics orders from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.StatsOrderResponse'
      summary: Statitstics all orders
      tags:
      - orders
  /products:
    get:
      description: Returns all products from the database
      parameters:
      - description: Number of products to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Number of products to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListProductResponse'
      summary: List all products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Add a new product to the database
      parameters:
      - description: Product data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ProductResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a product
      tags:
      - products
  /products/cursor:
    get:
      description: Returns products with cursor-based pagination. Pass the last product
        ID from the previous response as cursor.
      parameters:
      - description: Number of products to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Last product ID from previous page
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CursorProductsResponse'
      summary: List products (cursor-based)
      tags:
      - products
  /products/revenue-report:
    get:
      description: Returns products sorted by total revenue (SUM of price * quantity
        per product)
      parameters:
      - description: Number of products to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Number of products to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListRevenueReportResponse'
      summary: Get total revenue per product
      tags:
      - products
  /products/revenue-stats:
    get:
      description: Returns revenue stasts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RevenueStatsResponse'
      summary: Get revenue stats
      tags:
      - products
  /users:
    get:
      description: Returns all users from the database
      parameters:
      - description: Number of users to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Number of users to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListUserResponse'
      summary: List all users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a new user and publishes UserCreated event to Kafka
      parameters:
      - description: User data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a user
      tags:
      - users
  /users/by-most-expensive-product:
    get:
      description: Returns users by the most expensive product
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListUserByMostExpensiveProductResponse'
      summary: Get users by the most expensive product
      tags:
      - users
  /users/count:
    get:
      description: Returns count users from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CountResponse'
      summary: Count all users
      tags:
      - users
  /users/cursor:
    get:
      description: Returns users with cursor-based pagination. Pass the last user
        ID from the previous response as cursor.
      parameters:
      - description: Number of users to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Last users ID from previous page
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CursorUserResponse'
      summary: List users (cursor-based)
      tags:
      - users
  /users/daily-registrations:
    get:
      description: Returns user registration count for today
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DailyUserRegistrationResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get daily user registration
      tags:
      - users
  /users/search:
    get:
      description: Search users by field (partial match)
      parameters:
      - description: Field to search by
        enum:
        - email
        - name
        in: query
        name: field
        required: true
        type: string
      - description: Value to search for
        in: query
        name: value
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListUserResponse'
      summary: Search user by field
      tags:
      - users
  /users/top-3-users:
    get:
      description: Returns top 3 users with the highest number of total spent
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListUserWithTotalResponse'
      summary: Get top 3 users by total spent
      tags:
      - users
swagger: "2.0"
