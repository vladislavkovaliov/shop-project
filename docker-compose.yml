services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shop
    ports:
      - "55000:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./shop-api-golang/restore.sql:/docker-entrypoint-initdb.d/restore.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    ports:
      - "9092:9092"
      - "8081:8081"
    command:
      - redpanda
      - start
      - --mode dev-container
      - --advertise-kafka-addr redpanda:9092

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    ports:
      - "8082:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"

  graphql:
    build:
      context: ./shop-graphql-nestjs
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://postgres:password@postgres:5432/shop?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./shop-api-golang
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:password@postgres:5432/shop?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      rabbitmq:
        condition: service_started

  ssr:
    build:
      context: ./shop-ui-angular
      dockerfile: Dockerfile
    expose:
      - "4000"
    environment:
      PORT: "4000"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://postgres:password@postgres:5432/shop?sslmode=disable
      AUTH_SECRET: fd589bf745dd7796d65a5fb7d5a18e5069bf58de5070cda1c7569ab087635359
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./shop-ui-angular/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ssr
      - api

volumes:
  pgdata:
