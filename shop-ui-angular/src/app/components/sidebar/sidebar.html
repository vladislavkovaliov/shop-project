<aside class="w-64 h-screen bg-[#F9FAFB] border-r border-[#E5E7EB] flex flex-col">
  <div class="h-16 flex items-center px-6 border-b border-[#E5E7EB]">
    <a [routerLink]="['/']" class="text-sm font-semibold text-zinc-900 tracking-wide uppercase cursor-pointer hover:text-[#3b82f6] transition-colors">
      E-Comm Admin
    </a>
  </div>
  <nav class="flex-1 py-4">
    @for (item of menuItems; track item.label) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        class="flex items-center gap-3 px-6 py-3 text-sm font-medium transition-colors"
      >
        <mat-icon class="text-[22px]">{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  @if (user()?.user; as u) {
    <div class="border-t border-[#E5E7EB]">
      <button mat-button [matMenuTriggerFor]="userMenu"
              class="user-button w-full flex items-center gap-3 px-4 py-3 rounded-none h-auto">
        <mat-icon class="text-[22px] text-zinc-500">account_circle</mat-icon>
        <div class="flex flex-col items-start text-sm min-w-0">
          <span class="font-medium text-zinc-900 truncate w-full text-left">{{ u.name }}</span>
          <span class="text-xs text-zinc-500 truncate w-full text-left">{{ u.email }}</span>
        </div>
        <mat-icon class="ml-auto text-zinc-400 text-[20px]">expand_more</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu" x-position="before">
        <button mat-menu-item (click)="signOut()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  }
</aside>
