<div class="flex items-center justify-between px-6 pt-5 pb-2">
  <h2 class="text-lg font-semibold m-0">Create Category</h2>
  <button mat-icon-button (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content [formGroup]="form">
  <mat-form-field appearance="outline" class="pt-2 w-full">
    <mat-label>Category Name</mat-label>
    <input matInput formControlName="name" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Slug</mat-label>
    <input matInput formControlName="slug" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Description</mat-label>
    <textarea matInput formControlName="description" rows="3"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end" class="pt-2">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()">Submit</button>
</mat-dialog-actions>
