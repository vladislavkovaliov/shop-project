<div class="flex items-center justify-between px-6 pt-5 pb-2">
  <h2 class="text-lg font-semibold m-0">New Order</h2>
  <button mat-icon-button (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content [formGroup]="form">
  <mat-form-field appearance="outline" class="pt-2 w-full">
    <mat-label>User ID</mat-label>
    <input matInput formControlName="userId" />
  </mat-form-field>

  <h3 class="text-base font-medium text-zinc-800 mt-5 mb-3">Order Items</h3>

  @for (item of itemControls; track $index) {
    <div [formGroup]="item" class="flex gap-3 items-start mb-3">
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Product ID</mat-label>
        <input matInput formControlName="productId" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-24">
        <mat-label>Qty</mat-label>
        <input matInput type="number" formControlName="quantity" />
      </mat-form-field>
      @if (items.length > 1) {
        <button mat-icon-button (click)="removeItem($index)" class="mt-2">
          <mat-icon>close</mat-icon>
        </button>
      }
    </div>
  }

  <button mat-stroked-button (click)="addItem()" class="mt-2">
    <mat-icon>add_circle</mat-icon>
    Add Item
  </button>
</mat-dialog-content>

<mat-dialog-actions align="end" class="pt-2">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()">Submit</button>
</mat-dialog-actions>
