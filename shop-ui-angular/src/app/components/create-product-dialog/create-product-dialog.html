<div class="flex items-center justify-between px-6 pt-5 pb-2">
  <h2 class="text-lg font-semibold m-0">Create Product</h2>
  <button mat-icon-button (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content [formGroup]="form">
  <mat-form-field appearance="outline" class="pt-2 w-full">
    <mat-label>Product Name</mat-label>
    <input matInput formControlName="name" />
  </mat-form-field>

  <div class="flex gap-4">
    <mat-form-field appearance="outline" class="flex-1">
      <mat-label>Price ($)</mat-label>
      <input matInput type="number" formControlName="price" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-32">
      <mat-label>Stock</mat-label>
      <input matInput type="number" formControlName="stock" />
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Category</mat-label>
    <mat-select formControlName="category">
      @for (cat of categories; track cat) {
        <mat-option [value]="cat">{{ cat }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end" class="pt-2">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()">Submit</button>
</mat-dialog-actions>
