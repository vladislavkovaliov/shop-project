<div class="flex items-center justify-between mb-6">
  <div class="flex items-center gap-3">
    <h1 class="text-2xl font-semibold text-zinc-900">Products</h1>
    <span class="mock-badge">Mock</span>
  </div>
  <button mat-flat-button color="primary" (click)="openCreateProductDialog()">
    <mat-icon>add</mat-icon>
    Create Product
  </button>
</div>

<mat-tab-group [mat-stretch-tabs]="false" class="mb-6">
  <mat-tab label="Products List">
    <div class="mt-4">
      <table mat-table [dataSource]="pagedProducts" class="orders-table">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Product ID</th>
          <td mat-cell *matCellDef="let p">{{ p.id }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let p">{{ p.name }}</td>
        </ng-container>

        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef>Price</th>
          <td mat-cell *matCellDef="let p">{{ p.price }}</td>
        </ng-container>

        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef>Stock</th>
          <td mat-cell *matCellDef="let p">{{ p.stock }}</td>
        </ng-container>

        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Category</th>
          <td mat-cell *matCellDef="let p">{{ p.category }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="productColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: productColumns"></tr>
      </table>

      <mat-paginator
        [length]="totalProducts"
        [pageSize]="productPageSize"
        [pageIndex]="productPageIndex"
        [hidePageSize]="true"
        [showFirstLastButtons]="false"
        (page)="onProductPage($event)"
        class="orders-paginator"
      />
    </div>
  </mat-tab>

  <mat-tab label="Revenue Report">
    <div class="mt-4 space-y-6">
      <div class="grid grid-cols-3 gap-6">
        @for (stat of revenueStats; track stat.label) {
          <app-stat-card
            [label]="stat.label"
            [value]="stat.value"
            [mock]="true"
          />
        }
      </div>

      <div>
        <table mat-table [dataSource]="pagedRevenue" class="orders-table">
          <ng-container matColumnDef="month">
            <th mat-header-cell *matHeaderCellDef>Month</th>
            <td mat-cell *matCellDef="let r">{{ r.month }}</td>
          </ng-container>

          <ng-container matColumnDef="orders">
            <th mat-header-cell *matHeaderCellDef>Orders</th>
            <td mat-cell *matCellDef="let r">{{ r.orders }}</td>
          </ng-container>

          <ng-container matColumnDef="revenue">
            <th mat-header-cell *matHeaderCellDef>Revenue</th>
            <td mat-cell *matCellDef="let r">{{ r.revenue }}</td>
          </ng-container>

          <ng-container matColumnDef="growth">
            <th mat-header-cell *matHeaderCellDef>Growth</th>
            <td mat-cell *matCellDef="let r">{{ r.growth }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="revenueColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: revenueColumns"></tr>
        </table>

        <mat-paginator
          [length]="revenueData.length"
          [pageSize]="revenuePageSize"
          [pageIndex]="revenuePageIndex"
          [hidePageSize]="true"
          [showFirstLastButtons]="false"
          (page)="onRevenuePage($event)"
          class="orders-paginator"
        />
      </div>
    </div>
  </mat-tab>
</mat-tab-group>
